<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki dla Aktora</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Fiszki dla Aktora</h1>
            <div class="file-loader">
                <label for="fileInput" class="load-button">Wczytaj Scenariusz (.txt)</label>
                <input type="file" id="fileInput" accept=".txt" style="display: none;">
                 </div>
        </header>

        <main id="flashcard-area" class="flashcard-area">
            <div id="flashcard-container" class="flashcard-container">
                <div id="card-progress" class="card-progress"></div>
                <div id="card-content" class="card-content">
                    <p>Wczytaj plik .txt ze scenariuszem, aby rozpocząć.</p>
                    <p>Każdy akapit (oddzielony pustą linią) stanie się osobną fiszką.</p>
                </div>
                 </div>
        </main>

        <footer class="navigation">
            <button id="prev-card" class="nav-button" disabled>&laquo; Poprzednia</button>
            <button id="next-card" class="nav-button" disabled>Następna &raquo;</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
