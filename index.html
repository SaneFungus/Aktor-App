<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja dla Aktora - Nauka Tekstu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Aplikacja dla Aktora - Nauka Tekstu</h1>

    <div class="controls">
        <div class="file-controls">
            <label for="fileInput">Wczytaj plik tekstowy (.txt): </label>
            <input type="file" id="fileInput" accept=".txt">
            <button id="saveButton">Zapisz stan (HTML)</button>
            <button id="loadHtmlButton">Wczytaj stan (HTML)</button>
            <input type="file" id="htmlFileInput" accept=".html" style="display: none;">
        </div>

        <div class="editor-controls">
            <h3>Narzędzia edycji:</h3>
            <button class="format-button" data-style="dialogue">Dialog</button>
            <button class="format-button" data-style="monologue">Monolog</button>
            <button class="format-button" data-style="stage-direction">Didaskalia</button>
            <button class="format-button" data-style="my-line">Moja kwestia</button>
            <button id="clearFormatting">Wyczyść formatowanie</button>
            <div class="emoji-picker">
                <button class="emoji-button">😀</button>
                <button class="emoji-button">😂</button>
                <button class="emoji-button">🤔</button>
                <button class="emoji-button">😭</button>
                <button class="emoji-button">😠</button>
                </div>
        </div>

        <div class="learning-controls">
            <h3>Tryb nauki:</h3>
            <button id="startLearning">Rozpocznij naukę (ukryj moje kwestie)</button>
            <button id="checkAnswers" style="display: none;">Sprawdź odpowiedzi</button>
            <button id="exitLearning" style="display: none;">Zakończ naukę</button>
            <p id="score" style="display: none;"></p>
        </div>
    </div>

    <div id="script-container">
        <h2>Tekst Scenariusza:</h2>
        <div id="script-content" contenteditable="false">
            <p>Wczytaj plik tekstowy lub zapisany stan HTML, aby rozpocząć.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
